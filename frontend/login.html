<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CrediSkill</title>
    <link rel="stylesheet" href="style.css">
    <!-- 3D Libraries & GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <script src="models/avatar-data.js"></script>
    <script src="animations.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <canvas id="bg-main"></canvas>
    <header>
        <nav>
            <a href="index.html" class="logo">CrediSkill</a>
            <ul class="nav-links" id="auth-links"></ul>
        </nav>
    </header>
    
    <main>
        <div class="form-container glass-panel">
            <h2 style="margin-bottom: 1.5rem; text-align: center;">Welcome Back</h2>
            <div id="alertBox" class="alert hidden"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
    <label>Password</label>

    <div class="password-box">
        <input type="password" id="password" required>
        <span onclick="togglePassword()">👁️</span>
    </div>
</div>
                <button type="submit" class="btn" style="width: 100%;">Log In</button>
            </form>
            <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
                Don't have an account? <a href="register.html" style="color: var(--primary);">Register</a>
            </p>
        </div>
    </main>
</body>
</html>
