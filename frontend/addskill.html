<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Skill - CrediSkill</title>
    <link rel="stylesheet" href="style.css">
    <!-- 3D Libraries & GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="models/avatar-data.js"></script>
    <script src="animations.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <canvas id="bg-main"></canvas>
    <header>
        <nav>
            <a href="index.html" class="logo">CrediSkill</a>
            <ul class="nav-links" id="auth-links"></ul>
        </nav>
    </header>
    
    <main>
        <div class="form-container" style="max-width: 600px;">
            <h2 style="margin-bottom: 1.5rem; text-align: center;">Post a New Service</h2>
            <form id="addSkillForm">
                <div class="form-group">
                    <label for="title">Skill Title</label>
                    <input type="text" id="title" required placeholder="e.g. Full-Stack Web App Development">
                </div>
                <div class="form-group">
                    <label for="description">Detailed Description & Proof Details</label>
                    <textarea id="description" rows="5" required placeholder="Describe what you will do and link to your portfolio or certification proof..."></textarea>
                </div>
                <div class="form-group">
                    <label for="price">Price/Value ($) - (Used for ranking calculation)</label>
                    <input type="number" step="0.01" id="price" required>
                </div>
                <div class="form-group">
                    <label for="proofUrl">Proof URL (Portfolio, GitHub, Certificate)</label>
                    <input type="url" id="proofUrl" placeholder="https://github.com/your-profile">
                </div>
                <button type="submit" class="btn" style="width: 100%;">Publish Skill</button>
            </form>
        </div>
    </main>
</body>
</html>
